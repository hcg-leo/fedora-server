services:
    caddy:
        image: caddy
        restart: unless-stopped
        ports:
            - "80:80"
            - "8920:8920"
            - "3443:3443"
        extra_hosts:
            - "host.docker.internal:host-gateway"
        volumes:
            - /home/hcg_leo/fedora-server/caddy/caddyfile:/etc/caddy/Caddyfile:ro
            - /home/hcg_leo/fedora-server/caddy/data:/data
