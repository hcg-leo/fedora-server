services:
    caddy:
        image: caddy
        container_name: caddy
        restart: unless-stopped
        ports:
            - 80:80
            - 443:443
        extra_hosts:
            - host.docker.internal:host-gateway
        volumes:
            - ./Caddyfile:/etc/caddy/Caddyfile:ro
            - ./config:/config
            - ./data:/data
