services:
    vikunja:
        image: vikunja/vikunja
        container_name: vikunja
        environment:
            - VIKUNJA_SERVICE_SECRET=${SECRET}
        volumes:
            - /home/hcg_leo/fedora-server/vikunja/config.yml:/app/vikunja/config.yml:ro
            - /home/hcg_leo/fedora-server/vikunja/db:/db
            - /home/hcg_leo/fedora-server/vikunja/files:/app/vikunja/files
        ports:
            - 3456:3456
        restart: unless-stopped
