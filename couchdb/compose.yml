services:
    couchdb:
        image: couchdb
        container_name: couchdb
        restart: unless-stopped
        environment:
            - COUCHDB_USER=admin
            - COUCHDB_PASSWORD=${COUCHDB_PASSWORD}
        ports:
            - 5984:5984
        volumes:
            - ./data:/opt/couchdb/data
            - ./etc:/opt/couchdb/etc/local.d
