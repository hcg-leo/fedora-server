services:
    jellyfin:
        image: jellyfin/jellyfin
        container_name: jellyfin
        ports:
            - 8096:8096
        volumes:
            - /home/hcg_leo/fedora-server/jellyfin/config:/config
            - /home/hcg_leo/fedora-server/jellyfin/cache:/cache
            - /home/hcg_leo/fedora-server/jellyfin/media/admin/movies:/movies
            - /home/hcg_leo/fedora-server/jellyfin/media/admin/shows:/shows
            - /home/hcg_leo/fedora-server/jellyfin/media/admin/music:/music
            - /home/hcg_leo/fedora-server/jellyfin/media/tv/movies:/movies
        restart: unless-stopped
