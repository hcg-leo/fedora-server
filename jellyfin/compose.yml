services:
    jellyfin:
        image: jellyfin/jellyfin
        container_name: jellyfin
        restart: unless-stopped
        ports:
            - 8096:8096
        volumes:
            - ./config:/config
            - ./cache:/cache
            - ./branding.xml:/config/config/branding.xml

            - ./media/admin/movies:/movies
            - ./media/admin/shows:/shows
            - ./media/admin/music:/music

            - ./media/family/movies:/family-movies
