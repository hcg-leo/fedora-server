services:
    gluetun:
        image: qmcgaw/gluetun:latest
        container_name: gluetun
        cap_add:
            - NET_ADMIN
        devices:
            - /dev/net/tun:/dev/net/tun
        environment:
            - VPN_SERVICE_PROVIDER=mullvad
            - VPN_TYPE=wireguard
            - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
            - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES}
            - SERVER_CITIES=${SERVER_CITIES}
        volumes:
            - /home/hcg_leo/fedora-server/qbittorrent/gluetun:/gluetun
        ports:
            - 8080:8080
        restart: unless-stopped

    qbittorrent:
        image: lscr.io/linuxserver/qbittorrent:latest
        container_name: qbittorrent
        network_mode: "container:gluetun"
        depends_on:
            - gluetun
        environment:
            - WEBUI_PORT=8080
        volumes:
            - /home/hcg_leo/fedora-server/qbittorrent/config:/config
            - /home/hcg_leo/fedora-server/qbittorrent/downloads:/downloads
            - /home/hcg_leo/fedora-server/jellyfin/media/movies:/movies
            - /home/hcg_leo/fedora-server/jellyfin/media/shows:/shows
        restart: unless-stopped
